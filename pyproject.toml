[project]
name = "crypto-intelligence"
version = "0.1.0"
description = "Zero-cost crypto trading coach: regime detection, historical analogues, backtested strategies"
requires-python = ">=3.12"

# HARD POLICY: no torch, no transformers, no local LLM, no GPU dependency.
# tests/perf/test_no_torch.py fails the build if any of these appear.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.14",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
